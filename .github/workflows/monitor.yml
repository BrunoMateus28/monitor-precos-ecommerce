name: Monitor de Preços Diario

# Define os gatilhos (quando o script vai rodar)
on:
  schedule:
    # Roda todos os dias às 12:00 UTC (09:00 no horário de Brasília)
    - cron: '0 12 * * *'
  # Permite que você clique em um botão no GitHub para rodar manualmente na hora que quiser
  workflow_dispatch:

jobs:
  run-etl-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera a instalação das dependências

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Executar Extrator e Alertas
        # Aqui injetamos os Secrets que você cadastrou no painel do GitHub
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: 💾 Salvar Banco de Dados
        # Salva o .db atualizado de volta no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.db
          git commit -m "chore(db): atualiza histórico de preços via GitHub Actions [skip ci]" || echo "Nenhuma mudança no banco de dados."
          git push
